; LoRa Power Meter — see README.md
;
; Two physical nodes, two build environments:
;   walktest_camera   -> XIAO ESP32S3 Sense + Wio-SX1262 "for XIAO" (pin header, SKU 113010003)
;   walktest_gateway  -> XIAO ESP32S3 (plain) + Wio-SX1262 from the bundled kit (30-pin B2B)
;
; The two boards are the same MCU but the LoRa module attaches on a different
; connector, so the SX1262 control pins differ. See include/board_pins.h.
;
;   pio run -e walktest_camera -t upload
;   pio run -e walktest_gateway -t upload && pio device monitor -e walktest_gateway

[platformio]
default_envs = walktest_gateway

[env]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
lib_deps = jgromes/RadioLib@^7.7.1
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; Radio profile: LORA_PROFILE_FAST | LORA_PROFILE_BALANCED | LORA_PROFILE_ROBUST
    -DLORA_PROFILE_BALANCED

[env:walktest_camera]
build_src_filter = -<*> +<lora_radio.cpp> +<walktest/tx_main.cpp>
build_flags =
    ${env.build_flags}
    -DBOARD_CAMERA_NODE
    ; Set to 1 once you have fitted the external battery divider (see docs/hardware-notes.md)
    -DHAS_BATTERY_DIVIDER=0

[env:walktest_gateway]
build_src_filter = -<*> +<lora_radio.cpp> +<walktest/rx_main.cpp>
build_flags =
    ${env.build_flags}
    -DBOARD_GATEWAY_NODE

[env:diag_gateway]
build_src_filter = -<*> +<diag/spi_probe.cpp>
build_flags =
    ${env.build_flags}
    -DBOARD_GATEWAY_NODE

[env:diag_camera]
build_src_filter = -<*> +<diag/spi_probe.cpp>
build_flags =
    ${env.build_flags}
    -DBOARD_CAMERA_NODE

[env:camera_stream]
build_src_filter = -<*> +<camera/camera_hw.cpp> +<camera/stream_main.cpp>
build_flags =
    ${env.build_flags}
    -DBOARD_CAMERA_NODE

; Combined: LoRa pings + live USB camera. The bench/install configuration.
[env:camera_node]
build_src_filter = -<*> +<lora_radio.cpp> +<camera/camera_hw.cpp> +<node/camera_node_main.cpp>
build_flags =
    ${env.build_flags}
    -DBOARD_CAMERA_NODE
    -DHAS_BATTERY_DIVIDER=0

; Battery meter node: deep sleep, capture, OCR, LoRa reading.
; Plug USB in for BENCH mode (stays awake, streams, accepts SET commands).
[env:meter_node]
build_src_filter = -<*> +<lora_radio.cpp> +<camera/camera_hw.cpp> +<meter/*.cpp> +<node/meter_node_main.cpp>
build_flags =
    ${env.build_flags}
    -DBOARD_CAMERA_NODE
    -DHAS_BATTERY_DIVIDER=0
    -DLORA_PROFILE_ROBUST

; Gateway paired with meter_node. MUST match its radio profile -- nodes on
; different spreading factors cannot hear each other at all.
; The walktest_* pair stays at SF9; they are a diagnostic tool used together.
[env:meter_gateway]
build_src_filter = -<*> +<lora_radio.cpp> +<walktest/rx_main.cpp>
build_flags =
    ${env.build_flags}
    -DBOARD_GATEWAY_NODE
    -DLORA_PROFILE_ROBUST
